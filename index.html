<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3DBE70">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Txapi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: una columna estrecha tipo app movil; cabecera fija con racha y XP, camino de lecciones en zigzag, barra de navegacion inferior. */
:root{
  --bg:#F3F7F4;--surface:#FFFFFF;--ink:#17261E;--muted:#5A6E61;--line:#DCE6DF;
  --green:#27904F;--green-d:#1D6F3B;--green-t:#E3F5EA;--on-green:#FFFFFF;
  --red:#D9423A;--red-d:#AF2F29;--red-t:#FCE6E4;--on-red:#FFFFFF;
  --sun:#F2B134;--sun-d:#C98D14;--sun-t:#FFF3D6;--on-sun:#2A1E00;
  --blue:#2F70B5;--blue-d:#22578F;--blue-t:#E2EEF9;--on-blue:#FFFFFF;
  --dis:#D9E2DC;--dis-d:#C3CFC7;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A14;--surface:#182620;--ink:#E7F1EA;--muted:#9BB0A2;--line:#2A3B32;
  --green:#3DBE70;--green-d:#2A9856;--green-t:#173323;--on-green:#08170E;
  --red:#EF6259;--red-d:#C2433B;--red-t:#3A1B1A;--on-red:#2B0705;
  --sun:#F6C25A;--sun-d:#C99522;--sun-t:#3A2F14;--on-sun:#2A1E00;
  --blue:#5B9BDB;--blue-d:#3F78B0;--blue-t:#172A3D;--on-blue:#07182A;
  --dis:#26362D;--dis-d:#1D2A23;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A14;--surface:#182620;--ink:#E7F1EA;--muted:#9BB0A2;--line:#2A3B32;
  --green:#3DBE70;--green-d:#2A9856;--green-t:#173323;--on-green:#08170E;
  --red:#EF6259;--red-d:#C2433B;--red-t:#3A1B1A;--on-red:#2B0705;
  --sun:#F6C25A;--sun-d:#C99522;--sun-t:#3A2F14;--on-sun:#2A1E00;
  --blue:#5B9BDB;--blue-d:#3F78B0;--blue-t:#172A3D;--on-blue:#07182A;
  --dis:#26362D;--dis-d:#1D2A23;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;min-width:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}

/* cabecera */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.brand{font:700 22px var(--display);color:var(--green);margin-right:auto;display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;font:600 16px var(--display);padding:6px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.chip svg{width:18px;height:18px}
.chip.st{color:var(--sun-d)}.chip.xp{color:var(--blue)}.chip.lv{color:var(--green)}
.lvbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.lvbar i{display:block;height:100%;background:var(--green);border-radius:4px}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* nav */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.nin{max-width:560px;margin:0 auto;display:flex;gap:4px}
.nb{flex:1;border:2px solid transparent;background:none;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px var(--display);color:var(--muted)}
.nb svg{width:26px;height:26px}
.nb[aria-current="true"]{color:var(--blue);background:var(--blue-t);border-color:var(--blue)}

/* botones */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 18px;background:var(--green);color:var(--on-green);
  font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--green-d);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn[disabled]{background:var(--dis);color:var(--muted);box-shadow:0 4px 0 var(--dis-d);cursor:default}
.btn.sec{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.bad{background:var(--red);color:var(--on-red);box-shadow:0 4px 0 var(--red-d)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
.spk{border:0;background:var(--blue-t);color:var(--blue);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;flex:none;vertical-align:middle;margin-left:8px}
.spk svg{width:20px;height:20px}

/* inicio */
.hello{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hello svg,.hello img{flex:none}
.mas{display:block;flex:none;object-fit:contain}
.fbh{display:flex;align-items:center;gap:10px}
.exam b small{font-weight:600}
.rev.due{background:var(--green-t);border-color:var(--green)}
.rev.due svg{color:var(--green)}
.rev[disabled]{opacity:.6}
.exr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;position:relative;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.rev{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--sun-t);border:2px solid var(--sun);border-radius:18px;padding:12px 14px;margin-bottom:18px}
.rev[disabled]{opacity:.65;cursor:default}
.rev b{font:700 18px var(--display);display:block}
.rev span{font-size:14px;color:var(--muted)}
.rev svg{width:34px;height:34px;color:var(--sun-d);flex:none}
.unit{margin-bottom:26px}
.u-green{--uc:var(--green);--ucd:var(--green-d);--ucon:var(--on-green)}
.u-blue{--uc:var(--blue);--ucd:var(--blue-d);--ucon:var(--on-blue)}
.u-sun{--uc:var(--sun);--ucd:var(--sun-d);--ucon:var(--on-sun)}
.u-red{--uc:var(--red);--ucd:var(--red-d);--ucon:var(--on-red)}
.uh{background:var(--uc);color:var(--ucon);border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--ucd);margin-bottom:18px}
.uh h2{font-size:20px}.uh p{font-size:14px;opacity:.92}
.path{display:flex;flex-direction:column;align-items:center;gap:14px}
.lsn{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x));background:none;border:0;padding:0;width:140px}
.node{width:72px;height:72px;border-radius:50%;background:var(--uc);box-shadow:0 6px 0 var(--ucd);color:var(--ucon);font:700 28px var(--display);display:grid;place-items:center;position:relative}
.lsn:active .node{transform:translateY(4px);box-shadow:0 2px 0 var(--ucd)}
.node svg{width:32px;height:32px}
.lock .node{background:var(--dis);box-shadow:0 6px 0 var(--dis-d);color:var(--muted)}
.cur .node::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--uc);opacity:.45;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.88);opacity:.7}to{transform:scale(1.12);opacity:0}}
.lt{font:600 15px var(--display);text-align:center;line-height:1.15}
.lock .lt{color:var(--muted)}
.stars{color:var(--sun-d);font-size:15px;letter-spacing:2px;line-height:1}
.empieza{font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--uc)}

/* tarjetas */
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.game{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.gi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--gc);color:var(--gk)}
.gi svg{width:30px;height:30px}
.game h3{font-size:18px}.game p{font-size:14px;color:var(--muted)}
.best{font:600 13px var(--display);color:var(--sun-d)}
.sec-h{font:700 22px var(--display);margin:6px 0 12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font:700 26px var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.inp{width:100%;font:600 18px var(--body);padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .eu{font:600 18px var(--display)}
.vrow .es{color:var(--muted);font-size:15px}
.vrow .tx{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dis-d);flex:none}
.dot.l1{background:var(--red)}.dot.l2{background:var(--sun)}.dot.l3{background:var(--green)}
.vh{font:600 13px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 2px}

/* escenario (lecciones y juegos) */
#stage{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.sw{max-width:560px;margin:0 auto;min-height:inherit;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
.x{border:0;background:none;font:600 30px/1 var(--display);color:var(--muted);width:40px;height:40px;border-radius:50%}
.pb{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.ex{flex:1;padding:8px 0 20px;display:flex;flex-direction:column;gap:14px}
.q{font:700 22px var(--display);text-wrap:balance}
.big{font:600 30px var(--display);display:flex;align-items:center;flex-wrap:wrap;gap:4px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;background:var(--surface);font:600 18px var(--body);text-align:left;color:var(--ink)}
.opt.sel{border-color:var(--blue);background:var(--blue-t);color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-t)}
.opt.bad{border-color:var(--red);background:var(--red-t)}
.foot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px}
.fb{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--green-t);color:var(--green)}
.fb.no{background:var(--red-t);color:var(--red)}
.fb h3{font-size:20px}
.fb p{color:var(--ink);font-weight:600}
.ans{min-height:60px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 51px,var(--line) 51px 53px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 14px;background:var(--surface);font:600 18px var(--body);color:var(--ink)}
.tile.gone{visibility:hidden}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:grid;gap:10px;align-content:start}
.mt .opt{padding:14px 8px;text-align:center;font-size:17px;overflow-wrap:anywhere}
.mt .opt.done{opacity:.35;border-color:var(--green);background:var(--green-t)}
.mt .opt.flash{border-color:var(--red);background:var(--red-t);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
.modal>div{background:var(--surface);border-radius:20px;padding:20px;max-width:360px;width:100%;display:grid;gap:12px;text-align:center}
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:20px;flex:1}
.res .stat{width:100%}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;z-index:70;max-width:90vw;text-align:center}

/* wordle */
.wg{display:grid;gap:6px;justify-content:center}
.wr{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.wc{height:52px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font:700 26px var(--display);text-transform:uppercase;background:var(--surface)}
.wc.t{border-color:var(--muted)}
.wc.ok,.k.ok{background:var(--green);border-color:var(--green);color:var(--on-green)}
.wc.pr,.k.pr{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.wc.no,.k.no{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.kb{display:grid;gap:6px;margin-top:6px}
.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:40px;height:50px;border:0;border-radius:8px;background:var(--dis);font:700 16px var(--display);text-transform:uppercase;color:var(--ink);padding:0}
.k.w{max-width:62px;font-size:13px}

/* parejas */
.hud{display:flex;justify-content:space-between;align-items:center;font:700 20px var(--display)}
.tm{flex:1;height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:0 12px}
.tm i{display:block;height:100%;background:var(--sun);transition:width 1s linear}

/* historia */
.log{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.nar{align-self:center;text-align:center;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;max-width:92%}
.msg{max-width:86%;border-radius:18px;padding:10px 14px;border:2px solid var(--line);background:var(--surface)}
.msg.me{align-self:flex-end;background:var(--green-t);border-color:var(--green)}
.msg small{display:block;font:600 12px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.msg .eu{font:600 19px var(--display)}
.tr{font-size:14px;color:var(--muted);margin-top:2px}
.chap{align-self:center;font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:var(--on-sun);padding:5px 12px;border-radius:12px;margin-top:6px}
.hint{font-size:14px;color:var(--muted)}
.opt .t2{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.spk.slow{width:auto;border-radius:18px;padding:0 10px;font:600 12px var(--display);margin-left:4px}
.tips details{border-bottom:1px solid var(--line);padding:10px 2px}
.tips details:last-child{border-bottom:0}
.tips summary{font:600 16px var(--display);cursor:pointer}
.tips p{margin-top:6px;color:var(--muted);font-size:15px}
.gcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.gcard .gn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;font:700 20px var(--display)}
.gcard .gn svg{width:22px;height:22px}
.gcard.done .gn{background:var(--green-t);color:var(--green)}
.gcard h3{font-size:17px}.gcard p{font-size:14px;color:var(--muted)}
.xbox{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;line-height:1.6}
.xbox b{color:var(--blue)}
.exs{display:grid;gap:8px}
.exrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.exrow .tx{flex:1;min-width:0}.exrow .eu{font:600 18px var(--display)}.exrow .es{color:var(--muted);font-size:14px}
.dayc{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;display:grid;gap:8px}
.dayc h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dayc .btn{width:100%}
.dayc.warn{background:var(--red-t);border-color:var(--red)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;width:auto}
.cwg{display:grid;gap:2px;margin:0 auto}
.cwc{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:5px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font:700 clamp(15px,4.4vw,22px) var(--display);text-transform:uppercase;color:var(--ink);display:grid;place-items:center}
.cwc.blk{background:transparent;box-shadow:none}
.cwc.inw{background:var(--blue-t)}
.cwc.cur{background:var(--sun);color:var(--on-sun);box-shadow:inset 0 0 0 2px var(--sun-d)}
.cwc.wrong{background:var(--red-t);color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.cwc small{position:absolute;left:3px;top:1px;font:700 9px var(--body);color:var(--muted);line-height:1}
.cclue{background:var(--blue-t);color:var(--blue);border-radius:14px;padding:10px 12px;font-weight:800;min-height:48px;display:flex;align-items:center}
.cl{display:grid;gap:2px}
.cl button{border:0;background:none;text-align:left;padding:6px 6px;font:600 15px var(--body);color:var(--ink);border-radius:8px}
.cl button.on{background:var(--blue-t);color:var(--blue)}
.cl button.ok{color:var(--green)}
.wsg{display:grid;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto}
.wsc{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font:700 clamp(14px,4.2vw,20px) var(--display);text-transform:uppercase}
.wsc.sel{background:var(--sun);color:var(--on-sun)}
.wsc.fd{background:var(--green-t);color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.wsl{display:grid;gap:6px}
.wsl>div{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);font-weight:700}
.wsl>div.fd{background:var(--green-t);border-color:var(--green)}
.wsl .eu{font:600 18px var(--display);color:var(--green)}
select.inp{appearance:auto}
.blank{display:inline-block;min-width:84px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);padding:0 6px}
.blank.ok{color:var(--green);border-color:var(--green)}.blank.bad{color:var(--red);border-color:var(--red)}
.fs{font:600 24px var(--display);line-height:1.6;text-wrap:balance}
.bot{display:flex;gap:10px;align-items:flex-start}
.bot svg{flex:none}
.czp{font:600 20px var(--display);line-height:2.4}
.czp select{font:600 17px var(--body);padding:4px 6px;border-radius:10px;border:2px solid var(--blue);background:var(--surface);color:var(--ink);max-width:100%}
.czp select.ok{border-color:var(--green)}.czp select.bad{border-color:var(--red)}
.ta{width:100%;min-height:120px;font:600 17px var(--body);padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.lvt{display:flex;gap:6px;margin-bottom:16px}
.lvt button{flex:1;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:8px 4px;font:600 16px var(--display);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.lvt button small{font:700 12px var(--body)}

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function E(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dayKey(d){var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();return y+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}

/* ---------- estado ---------- */
function def(){return {xp:0,streak:0,last:"",done:{},words:{},story:0,best:{pairs:0},sound:true,gram:{},daily:"",open:false}}
function load(){try{var j=JSON.parse(localStorage.getItem("hitzez1"));if(j&&typeof j==="object"){var d=def();for(var k in j)d[k]=j[k];if(!d.best)d.best={pairs:0,wordle:0};return d}}catch(e){}return def()}
var S=load();
function save(){try{localStorage.setItem("hitzez1",JSON.stringify(S))}catch(e){}}
function level(){return Math.floor(S.xp/100)+1}
function touchDay(){var t=dayKey(new Date());if(S.last===t)return;var y=new Date();y.setDate(y.getDate()-1);S.streak=(S.last===dayKey(y))?S.streak+1:1;S.last=t}
function dispStreak(){var t=new Date(),y=new Date();y.setDate(y.getDate()-1);return (S.last===dayKey(t)||S.last===dayKey(y))?S.streak:0}
function addXP(n){var before=level();S.xp+=n;touchDay();save();return level()>before}
function rec(eu,ok){S.words[eu]=clamp((S.words[eu]||0)+(ok?1:-2),0,5);save()}
function curIdx(){for(var i=0;i<LESSONS.length;i++)if(!S.done[LESSONS[i].id])return i;return LESSONS.length}
function learnedWords(){var out=[];WORDS.forEach(function(w){if(S.done[w.lid])out.push(w)});return out}
function unlockedWords(){var n=S.open?LESSONS.length:Math.max(curIdx(),0),ids={};LESSONS.forEach(function(l,i){if(i<=n||S.done[l.id])ids[l.id]=1});return WORDS.filter(function(w){return ids[w.lid]})}
function unlockedPhr(){var ids={};var n=S.open?LESSONS.length:curIdx();LESSONS.forEach(function(l,i){if(i<=n||S.done[l.id])ids[l.id]=1});return PHR.filter(function(p){return ids[p.lid]})}
function dueWords(){return learnedWords().filter(function(w){return (S.words[w.eu]||0)<=3})}

/* ---------- voz y sonido ---------- */
var VZ={list:[],voice:null,rate:.9,ok:("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window)};
function pickVoice(){
  if(!VZ.ok)return;
  try{
    VZ.list=speechSynthesis.getVoices()||[];
    var saved="";try{saved=localStorage.getItem("hitzezVoice")||""}catch(e){}
    var v=null;
    if(saved)v=VZ.list.find(function(x){return x.voiceURI===saved})||null;
    if(!v)v=VZ.list.find(function(x){return /^eu/i.test(x.lang)})||VZ.list.find(function(x){return /^es[-_]ES/i.test(x.lang)})||VZ.list.find(function(x){return /^es/i.test(x.lang)})||null;
    VZ.voice=v;
  }catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=function(){pickVoice();if(V.tab==="me"&&!$("#home").hidden)render()}}catch(e){}
function say(t,slow){
  if(!VZ.ok){toast("Este navegador no tiene voz. Prueba en Chrome.");return}
  try{
    if(!VZ.list.length)pickVoice();
    var u=new SpeechSynthesisUtterance(String(t).replace(/[?!¿¡]/g,""));
    if(VZ.voice){u.voice=VZ.voice;u.lang=VZ.voice.lang}else u.lang="eu-ES";
    u.rate=slow?.55:VZ.rate;u.volume=1;
    u.onerror=function(){toast("No se pudo reproducir el audio. Revisa el volumen y la voz del móvil (Perfil).")};
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    setTimeout(function(){try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){}},60);
  }catch(e){toast("No se pudo reproducir el audio.")}
}
var ac=null;
function beep(ok){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type="sine";var t=ac.currentTime;if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09)}else{o.frequency.setValueAtTime(240,t);o.frequency.setValueAtTime(170,t+.1)}g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.26);o.start(t);o.stop(t+.27)}catch(e){}}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},1800)}

var GR=[
{id:"g1",t:"El verbo va al final",s:"Por qué «naiz» va detrás",
 x:"En euskera el orden normal es <b>sujeto – resto de la frase – verbo</b>. El verbo cierra la frase. En español dices «Yo <u>soy</u> Ane»; en euskera, literalmente, «Yo Ane <u>soy</u>»: <b>Ni Ane naiz</b>.<br><br>Por eso <b>naiz</b>, <b>da</b>, <b>dut</b> y los demás verbos van detrás. Lo que quieres preguntar o destacar se coloca justo antes del verbo.",
 ex:[["Ni Ane naiz","Yo soy Ane"],["Ane etxera doa","Ane va a casa"],["Amak ogia jaten du","Mamá come pan"],["Zer nahi duzu?","¿Qué quieres?"]],
 q:[{q:"¿Dónde va el verbo en una frase neutra en euskera?",o:["Al principio","Después del sujeto","Al final"],a:"Al final",w:"El orden habitual es sujeto, resto de la frase y verbo."},

{id:"g19",t:"tx, ts, tz, x, z, s",s:"Las letras que más confunden",
 x:"Hay tres parejas de sonidos. Cada sonido simple tiene una versión con <b>t</b> delante, más corta y explosiva:<br>• <b>s</b> («s» fuerte, como en español de España) → <b>ts</b>: <b>itsaso</b>, <b>atsegin</b>.<br>• <b>z</b> (una «s» más suave; <u>no</u> es la z de «zapato») → <b>tz</b>: <b>hitz</b>, <b>atzo</b>, <b>utzi</b>.<br>• <b>x</b> («sh», como en inglés «shop») → <b>tx</b> («ch» de «chico»): <b>txapela</b>, <b>gutxi</b>, <b>etxe</b>.<br><br>Truco: la <b>t</b> convierte el sonido en una pequeña explosión: «s» pasa a «ts», «z» a «tz» y «sh» a «ch».<br>Un caso típico: <b>zortzi</b> (ocho) lleva z y tz, algo así como «sortsi» con sonidos suaves.<br>Importa: <b>su</b> (fuego) y <b>zu</b> (tú), o <b>hots</b> (ruido) y <b>hotz</b> (frío), son palabras distintas.",
 ex:[["txapela","se lee «chapela» · la boina"],["etxe","se lee «eche» · casa"],["itsaso","con ts fuerte · el mar"],["hitz","con tz suave · palabra"],["zortzi","z y tz suaves · ocho"],["su","fuego (zu es «tú»)"],["hotz","frío (hots es «ruido»)"]],
 q:[{q:"¿Cómo suena «tx»?",o:["Como «ch»","Como «sh»","Como «ts» fuerte"],a:"Como «ch»",w:"tx es la «ch» de «chico»: txapela, etxe."},
    {q:"¿Cuál significa «frío»?",o:["hotz","hots","hoxt"],a:"hotz",w:"hotz (frío) lleva tz; hots (ruido) lleva ts."},
    {q:"«Zortzi» (ocho) ¿qué sonidos lleva?",o:["z y tz","s y ts","x y tx"],a:"z y tz",w:"Los dos son los sonidos suaves, z y tz."}]},
{id:"g2",t:"Pronunciación y letras",s:"Cómo suena cada letra",
 x:"El euskera se lee como se escribe y tiene 5 vocales puras, como el español. Ojo con estas letras:<br>• <b>h</b> no suena: <b>hamar</b> se lee «amar».<br>• <b>z</b> suena como una «s», no como la z de «zapato».<br>• <b>s</b> es una «s» algo más gruesa y sorda.<br>• <b>x</b> suena «sh» y <b>tx</b> suena «ch».<br>• <b>ts</b> y <b>tz</b> son sonidos de «ts», como en «tsunami».<br>• <b>g</b> siempre es fuerte: <b>gizon</b> se lee «guizon».<br>• <b>rr</b> es vibrante y <b>r</b> es simple.<br><br>El acento y la entonación cambian según la zona y no se escriben. Se aprenden imitando a hablantes nativos, así que usa el botón de audio y repite.",

{id:"g3",t:"Sin género: el artículo -a",s:"Casa, la casa, una casa, las casas",
 x:"El euskera no tiene género. No hay «el» y «la» sueltos: el artículo se pega al final de la palabra. <b>etxe</b> (casa) → <b>etxea</b> (la casa). Si la palabra ya acaba en -a, no cambia: <b>ama</b> vale para «madre» y «la madre».<br><br>«Un» o «una» se dice con <b>bat</b> detrás del nombre: <b>etxe bat</b>. El plural es <b>-ak</b>: <b>etxeak</b> (las casas).",
 ex:[["etxe → etxea","casa → la casa"],["etxe bat","una casa"],["etxeak","las casas"],["ama","madre / la madre"]],
 q:[{q:"¿Cómo se dice «la mesa»? (mahai = mesa)",o:["mahai","mahaia","mahaiak"],a:"mahaia",w:"El artículo -a se pega al final."},
    {q:"¿Cómo se dice «una puerta»? (ate = puerta)",o:["ate bat","atea bat","bat ate"],a:"ate bat",w:"Bat va detrás del nombre y sin artículo."},
    {q:"¿Cómo se dice «las puertas»?",o:["atea","ateak","ate bat"],a:"ateak",w:"El plural añade -ak."}]},
{id:"g4",t:"Ser: izan",s:"Identidad, profesión y cualidades",
 x:"<b>Izan</b> significa «ser». Se usa para decir quién eres, qué eres y cómo es algo.<br><br><b>naiz</b> (yo soy), <b>zara</b> (tú eres), <b>da</b> (él/ella es), <b>gara</b> (nosotros somos), <b>zarete</b> (vosotros sois), <b>dira</b> (ellos son).<br><br>El pronombre (ni, zu...) suele omitirse: «Ikaslea naiz». El verbo va al final.",
 ex:[["Ikaslea naiz","Soy estudiante"],["Zu irakaslea zara","Tú eres profesor"],["Etxea handia da","La casa es grande"],["Gu lagunak gara","Somos amigos"]],
 q:[{q:"¿Cómo se dice «tú eres»?",o:["naiz","zara","da"],a:"zara",w:"Zu zara: tú eres."},
    {q:"Completa: «Gu lagunak ___» (somos amigos)",o:["gara","zarete","dira"],a:"gara",w:"Gu gara: nosotros somos."},
    {q:"Completa: «Etxeak handiak ___» (las casas son grandes)",o:["da","dira","naiz"],a:"dira",w:"Con sujeto plural, da pasa a dira."}]},
{id:"g5",t:"Estar: egon",s:"Lugares y estados",
 x:"<b>Egon</b> significa «estar» y se usa para lugares y estados.<br><br><b>nago</b> (yo estoy), <b>zaude</b> (tú estás), <b>dago</b> (él/ella está), <b>gaude</b> (nosotros estamos), <b>zaudete</b> (vosotros estáis), <b>daude</b> (ellos están).<br><br>Diferencia: <b>Ane irakaslea da</b> (Ane es profesora) y <b>Ane etxean dago</b> (Ane está en casa).",
 ex:[["Etxean nago","Estoy en casa"],["Non zaude?","¿Dónde estás?"],["Ama sukaldean dago","Mamá está en la cocina"],["Gu hirian gaude","Estamos en la ciudad"]],
 q:[{q:"¿Cómo se dice «Estoy en casa»?",o:["Etxean naiz","Etxean nago","Etxean dut"],a:"Etxean nago",w:"Para lugares se usa egon: nago."},
    {q:"Completa: «Ane irakaslea ___» (es profesora)",o:["da","dago","gara"],a:"da",w:"La profesión se dice con izan: da."},
    {q:"Completa: «Gu hirian ___» (estamos en la ciudad)",o:["gara","gaude","daude"],a:"gaude",w:"Lugar y nosotros: gaude."}]},
{id:"g6",t:"Adjetivos, plural y «este»",s:"Etxe handia, etxe hau",
 x:"El adjetivo va <b>detrás</b> del nombre y lleva el artículo: <b>etxe handia</b> (la casa grande). En plural los dos llevan -ak: <b>etxe handiak</b>.<br><br>Con el verbo: <b>Etxea handia da</b> → <b>Etxeak handiak dira</b>.<br><br>Para «este», «ese» y «aquel» se usa <b>hau</b>, <b>hori</b> y <b>hura</b> detrás del nombre, sin artículo: <b>etxe hau</b> (esta casa).",
 ex:[["etxe handia","la casa grande"],["etxe handiak","las casas grandes"],["etxe hau","esta casa"],["etxe hori","esa casa"],["etxe hura","aquella casa"]],
 q:[{q:"¿Cómo se dice «la casa pequeña»? (txiki = pequeño)",o:["txikia etxe","etxe txikia","etxea txiki"],a:"etxe txikia",w:"El adjetivo va detrás y lleva -a."},
    {q:"¿Cómo se dice «esta casa»?",o:["hau etxe","etxea hau","etxe hau"],a:"etxe hau",w:"Hau va detrás del nombre, sin artículo."},
    {q:"¿Cómo se dice «las casas grandes»?",o:["etxe handiak","etxe handia","etxeak handia"],a:"etxe handiak",w:"Nombre y adjetivo llevan -ak."}]},
{id:"g7",t:"Pronombres y posesivos",s:"Ni, zu, nire, zure",
 x:"Pronombres: <b>ni</b> (yo), <b>zu</b> (tú), <b>hura</b> (él/ella), <b>gu</b> (nosotros), <b>zuek</b> (vosotros), <b>haiek</b> (ellos).<br><br>Posesivos: <b>nire</b> (mi), <b>zure</b> (tu), <b>bere</b> (su), <b>gure</b> (nuestro), <b>zuen</b> (vuestro), <b>haien</b> (su, de ellos).<br><br>Los posesivos van <b>delante</b> del nombre: <b>nire etxea</b> (mi casa).",
 ex:[["nire etxea","mi casa"],["zure ama","tu madre"],["gure laguna","nuestro amigo"],["haien familia","su familia (de ellos)"]],
 q:[{q:"¿Cómo se dice «mi casa»?",o:["etxea nire","nire etxea","ni etxea"],a:"nire etxea",w:"El posesivo va delante."},
    {q:"¿Cómo se dice «tu madre»?",o:["zure ama","zu ama","ama zure"],a:"zure ama",w:"Zure es «tu»."},
    {q:"¿Qué significa «gure»?",o:["su","nuestro","vuestro"],a:"nuestro",w:"Gu es «nosotros» y gure es «nuestro»."}]},
{id:"g8",t:"Casos: las terminaciones",s:"En, a, desde, con, de",
 x:"El euskera usa terminaciones donde el español usa preposiciones:<br>• <b>-n</b> en: <b>etxean</b> (en casa)<br>• <b>-ra</b> a: <b>etxera</b> (a casa)<br>• <b>-tik</b> desde: <b>etxetik</b> (desde casa)<br>• <b>-rekin</b> con: <b>amarekin</b> (con mamá)<br>• <b>-ren</b> de: <b>amaren etxea</b> (la casa de mamá)<br><br>Tras vocal se añade una <b>r</b> (ama<b>r</b>ekin); tras consonante no (Jonekin, Jonen). Aprende las formas con sus ejemplos completos.",
 ex:[["etxean","en casa"],["etxera","a casa"],["etxetik","desde casa"],["amarekin","con mamá"],["amaren etxea","la casa de mamá"]],
 q:[{q:"¿Cómo se dice «a la playa»? (hondartza = playa)",o:["hondartzan","hondartzara","hondartzarekin"],a:"hondartzara",w:"-ra indica destino."},
    {q:"¿Cómo se dice «con papá»? (aita = padre)",o:["aitaren","aitarekin","aitara"],a:"aitarekin",w:"-rekin es «con»."},
    {q:"¿Cómo se dice «en la ciudad»? (hiria = la ciudad)",o:["hirian","hirira","hiritik"],a:"hirian",w:"-n es «en»."}]},
{id:"g9",t:"Ir y venir",s:"Joan y etorri",
 x:"<b>Joan</b> (ir): <b>noa, zoaz, doa, goaz, zoazte, doaz</b>.<br><b>Etorri</b> (venir): <b>nator, zatoz, dator, gatoz, zatozte, datoz</b>.<br><br>El destino lleva <b>-ra</b> y el origen <b>-tik</b>: <b>Hondartzara noa</b> (voy a la playa), <b>Nondik zatoz?</b> (¿de dónde vienes?).",
 ex:[["Hondartzara noa","Voy a la playa"],["Etxera goaz","Vamos a casa"],["Nondik zatoz?","¿De dónde vienes?"],["Ane hona dator","Ane viene aquí"]],
 q:[{q:"¿Cómo se dice «Voy a casa»?",o:["Etxera noa","Etxean nago","Etxera nator"],a:"Etxera noa",w:"Joan: noa, y -ra para el destino."},
    {q:"¿Cómo se dice «ellos vienen»?",o:["doaz","datoz","daude"],a:"datoz",w:"Etorri con ellos: datoz."},
    {q:"¿Cómo se dice «vosotros vais»?",o:["zoazte","zatozte","zarete"],a:"zoazte",w:"Joan con vosotros: zoazte."}]},
{id:"g10",t:"Verbos con auxiliar",s:"Jaten dut, edaten dugu",
 x:"La mayoría de los verbos no se conjugan solos: se usa <b>verbo + auxiliar</b>. Para el presente habitual: raíz + <b>-ten / -tzen</b> + auxiliar. <b>jan</b> → <b>jaten dut</b> (como).<br><br>Auxiliar con un objeto en singular: <b>dut</b> (yo), <b>duzu</b> (tú), <b>du</b> (él/ella), <b>dugu</b> (nosotros), <b>duzue</b> (vosotros), <b>dute</b> (ellos).<br><br><b>Nahi dut</b> significa «quiero».",
 ex:[["Ogia jaten dut","Como pan"],["Kafea edaten dugu","Bebemos café"],["Euskara ikasten dut","Estudio euskera"],["Ura nahi dut","Quiero agua"]],
 q:[{q:"¿Cuál es el auxiliar de «tú»?",o:["dut","duzu","dugu"],a:"duzu",w:"Nik dut, zuk duzu, guk dugu."},
    {q:"¿Cómo se dice «Bebemos café»?",o:["Kafea edaten dugu","Kafea edaten dut","Kafea edaten du"],a:"Kafea edaten dugu",w:"Nosotros usa el auxiliar dugu."},
    {q:"El presente habitual de «ikasi» (estudiar) es...",o:["ikasten","ikasiten","ikasi"],a:"ikasten",w:"Ikasi → ikasten."}]},
{id:"g11",t:"El sujeto con -k",s:"Amak ogia jaten du",
 x:"Cuando el verbo lleva objeto directo (comer, querer, ver), el sujeto toma <b>-k</b>: <b>ama</b> → <b>amak</b>. <b>Ni</b> → <b>nik</b>. Tras consonante es <b>-ek</b> (Jon → Jonek). Este caso se llama ergativo.<br><br>Con ser, estar e ir no hay -k: «Ama etxean dago».<br><br>Es lo más raro para un hispanohablante. Piensa en la -k como la marca de «quien hace la acción sobre algo».",
 ex:[["Amak ogia jaten du","Mamá come pan"],["Nik ura nahi dut","Yo quiero agua"],["Jonek kafea edaten du","Jon bebe café"],["Ama etxean dago","Mamá está en casa"]],
 q:[{q:"¿Cómo se dice «Mamá come pan»?",o:["Ama ogia jaten du","Amak ogia jaten du","Amak ogia jaten da"],a:"Amak ogia jaten du",w:"Hay objeto directo, así que el sujeto lleva -k."},
    {q:"¿Cómo se dice «Yo quiero agua»?",o:["Ni ura nahi dut","Nik ura nahi dut","Nik ura nahi naiz"],a:"Nik ura nahi dut",w:"Ni se convierte en nik."},
    {q:"¿Qué frase es correcta?",o:["Amak etxean dago","Ama etxean dago"],a:"Ama etxean dago",w:"Con egon (estar) no se usa -k."}]},
{id:"g12",t:"Negar y preguntar",s:"Ez, zer, non, zergatik",
 x:"<b>Ez</b> (no) va justo delante del verbo: <b>Ez naiz ikaslea</b> (no soy estudiante). Con objeto aparece muchas veces <b>-rik</b>: <b>Ez dut ogirik</b> (no tengo pan).<br><br>Las palabras de pregunta van antes del verbo: <b>zer</b> (qué), <b>nor</b> (quién), <b>non</b> (dónde), <b>noiz</b> (cuándo), <b>nola</b> (cómo), <b>zergatik</b> (por qué), <b>zenbat</b> (cuánto).<br><br>Las preguntas de sí o no usan la misma frase con entonación de pregunta, o <b>al</b> delante del verbo: <b>Ikaslea al zara?</b>",
 ex:[["Ez naiz ikaslea","No soy estudiante"],["Ez dut ogirik","No tengo pan"],["Non dago geltokia?","¿Dónde está la estación?"],["Zergatik zaude hemen?","¿Por qué estás aquí?"]],
 q:[{q:"¿Cómo se dice «No soy estudiante»?",o:["Ez naiz ikaslea","Naiz ez ikaslea","Ikaslea ez"],a:"Ez naiz ikaslea",w:"Ez va justo delante del verbo."},
    {q:"¿Qué significa «non»?",o:["cuándo","dónde","quién"],a:"dónde",w:"Non dago...? es «¿dónde está...?»."},
    {q:"¿Cómo se dice «¿por qué?»",o:["zenbat","zergatik","noiz"],a:"zergatik",w:"Zergatik es «por qué»."}]}
];
var GR2=[
{id:"g13",t:"Pasado de ser y estar",s:"Nintzen, zen, nengoen",
 x:"Pasado de <b>izan</b>: <b>nintzen, zinen, zen, ginen, zineten, ziren</b>. Pasado de <b>egon</b>: <b>nengoen, zeunden, zegoen, geunden, zeundeten, zeuden</b>. El uso es el mismo que en presente: izan para identidad y egon para lugar. Marcas útiles: <b>atzo</b> (ayer), <b>lehen</b> (antes).",
 ex:[["Ni ikaslea nintzen","Yo era estudiante"],["Atzo etxean nengoen","Ayer estaba en casa"],["Etxea handia zen","La casa era grande"]],
 q:[{q:"¿Cómo se dice «yo era»?",o:["naiz","nintzen","nengoen"],a:"nintzen",w:"Pasado de izan para «yo»."},
    {q:"¿Cómo se dice «ayer estaba en casa»?",o:["Atzo etxean nago","Atzo etxean nengoen","Atzo etxean nintzen"],a:"Atzo etxean nengoen",w:"Lugar y pasado: egon, nengoen."},
    {q:"Completa: «Etxea handia ___»",o:["zen","da","zegoen"],a:"zen",w:"Cualidad en pasado: zen."}]},
{id:"g14",t:"Pasado y futuro con auxiliar",s:"Jan nuen, joango naiz",
 x:"<b>Pasado</b>: participio + auxiliar en pasado: <b>jan nuen</b> (comí), <b>ikusi genuen</b> (vimos). <b>Futuro</b>: participio + <b>-ko</b> (o <b>-go</b> si acaba en n) + auxiliar en presente: <b>ikasiko dut</b> (estudiaré), <b>joango naiz</b> (iré), <b>egingo dut</b> (haré).",
 ex:[["Atzo ogia jan nuen","Ayer comí pan"],["Bihar etxera joango naiz","Mañana iré a casa"],["Gero kafea edango dugu","Luego beberemos café"]],

    {q:"¿Cómo se dice «ayer comí pan»?",o:["Atzo ogia jango dut","Atzo ogia jan nuen","Atzo ogia jaten dut"],a:"Atzo ogia jan nuen",w:"Pasado: participio + nuen."},
    {q:"El futuro de «ikasi» (estudiar) es...",o:["ikasiko","ikasigo","ikasten"],a:"ikasiko",w:"Termina en -i, así que lleva -ko."}]},
{id:"g15",t:"Gustar: el dativo",s:"Niri gustatzen zait",
 x:"Para «gustar», lo que gusta es el sujeto y la persona es el complemento: <b>Niri kafea gustatzen zait</b> («a mí el café me gusta»). Persona: <b>zait</b> (me), <b>zaizu</b> (te), <b>zaio</b> (le). Si lo que gusta es plural: <b>zaizkit</b>, <b>zaizkizu</b>, <b>zaizkio</b>. A quien le gusta lleva <b>-ri</b>: <b>niri</b>, <b>zuri</b>, <b>amari</b>.",
 ex:[["Niri musika gustatzen zait","Me gusta la música"],["Amari ez zaio gustatzen","A mamá no le gusta"],["Niri sagarrak gustatzen zaizkit","Me gustan las manzanas"]],
 q:[{q:"¿Cómo se dice «a mí»?",o:["nik","niri","nire"],a:"niri",w:"Niri es «a mí»; nik es sujeto y nire es «mi»."},
    {q:"Completa: «Niri sagarrak gustatzen ___»",o:["zait","zaizkit","dut"],a:"zaizkit",w:"Sagarrak es plural."},
    {q:"¿Cómo se dice «a mamá le gusta»?",o:["Amak gustatzen du","Amari gustatzen zaio","Ama gustatzen da"],a:"Amari gustatzen zaio",w:"A mamá: amari; le: zaio."}]},
{id:"g16",t:"«Que» y «porque»",s:"-ela y -lako",
 x:"Detrás de pensar, saber o decir, el auxiliar añade <b>-la</b>: <b>da</b> → <b>dela</b>, <b>dago</b> → <b>dagoela</b>, <b>du</b> → <b>duela</b>, <b>dut</b> → <b>dudala</b>. <b>Uste dut etxea handia dela</b> (creo que la casa es grande). Para la causa se añade <b>-lako</b>: <b>Gaixo nagoelako, etxean nago</b> (estoy en casa porque estoy enfermo).",
 ex:[["Uste dut Ane etxean dagoela","Creo que Ane está en casa"],["Badakit euskara zaila dela","Sé que el euskera es difícil"],["Euria ari duelako, etxean geratu naiz","Me he quedado en casa porque llueve"]],
 q:[{q:"«Que es» tras «uste dut» es...",o:["da","dela","delako"],a:"dela",w:"-la une la subordinada."},
    {q:"«Porque está enfermo» es...",o:["gaixo dago","gaixo dagoela","gaixo dagoelako"],a:"gaixo dagoelako",w:"-lako expresa causa."},
    {q:"¿Cómo se dice «creo que Ane es profesora»?",o:["Uste dut Ane irakaslea dela","Uste dut Ane irakaslea da","Uste dut Ane irakaslea delako"],a:"Uste dut Ane irakaslea dela",w:"Tras uste dut, da pasa a dela."}]},
{id:"g17",t:"Relativas con -en",s:"Etxean dagoen gizona",
 x:"La oración relativa va <b>antes</b> del nombre y su verbo acaba en <b>-n</b>: <b>dago</b> → <b>dagoen</b>, <b>du</b> → <b>duen</b>, <b>dut</b> → <b>dudan</b>, <b>da</b> → <b>den</b>. <b>Etxean dagoen gizona</b> es «el hombre que está en casa». En pasado el auxiliar ya acaba en -n: <b>ikusi nuen liburua</b> (el libro que vi).",
 ex:[["Etxean dagoen gizona","El hombre que está en casa"],["Ikusi dudan liburua","El libro que he visto"],["Euskaraz hitz egiten duen irakaslea","El profesor que habla euskera"]],
 q:[{q:"¿Cómo se dice «la mujer que está en casa»?",o:["Dagoen etxean emakumea","Etxean dagoen emakumea","Emakumea etxean dagoen"],a:"Etxean dagoen emakumea",w:"La relativa va antes del nombre."},
    {q:"«Que tengo» (de dut) en una relativa es...",o:["dudan","dudala","dut"],a:"dudan",w:"Dut + -n = dudan."},
    {q:"En «atzo ikusi nuen liburua», ¿qué significa «nuen»?",o:["que yo vi","que él vio","que yo veré"],a:"que yo vi",w:"Nuen ya acaba en -n."}]},
{id:"g18",t:"Condicional y deseo",s:"Banu, nuke, nahi nuke",
 x:"El condicional lleva <b>-ke</b>: <b>erosiko nuke</b> (compraría). La condición irreal lleva <b>ba-</b> delante: <b>banu</b> (si tuviera), <b>banintz</b> (si fuera). Orden: <b>Dirua banu, etxea erosiko nuke</b>. Para pedir con cortesía: <b>nahi nuke</b> (querría).",
 ex:[["Dirua banu, etxea erosiko nuke","Si tuviera dinero, compraría una casa"],["Aberatsa banintz, mundua ikusiko nuke","Si fuera rico, vería el mundo"],["Kafe bat nahi nuke","Querría un café"]],
 q:[{q:"«Si tuviera» (de ukan) es...",o:["banu","banintz","nuke"],a:"banu",w:"Banu para ukan; banintz para izan."},
    {q:"«Compraría» se dice...",o:["erosiko dut","erosiko nuke","erosi nuen"],a:"erosiko nuke",w:"-ko nuke: condicional."},
    {q:"¿Qué frase es una petición cortés?",o:["Kafe bat nahi nuke","Kafe bat nahi dut","Kafe bat nahi nuen"],a:"Kafe bat nahi nuke",w:"Nahi nuke suena más cortés."}]}
];

function mcQueue(g){return g.q.map(function(x){return {t:"mc",q:x.q,opts:shuffle(x.o),ans:x.a,why:x.w}})}
function dayNum(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
function rDaily(){
  var n=dayNum(),t=dayKey(new Date()),lw=learnedWords(),pool=lw.length?lw:WORDS.slice(0,10);
  var w=pool[n%pool.length],g=GR[n%GR.length],tip=TIPS[n%TIPS.length],done=S.daily===t,s=dispStreak(),h="";
  if(s>0&&S.last!==t)h+='<div class="dayc warn"><h3>Racha en peligro</h3><p>Llevas '+s+' día'+(s>1?'s':'')+' seguido'+(s>1?'s':'')+'. Haz una lección o el repaso de hoy para no perderla.</p></div>';
  h+='<div class="dayc"><h3>Hoy</h3><div class="vrow" style="padding:4px 0;border:0"><div class="tx"><div class="eu">Palabra del día: '+E(w.eu)+'</div><div class="es">'+E(w.es)+'</div></div>'+spk(w.eu)+'</div>'
   +'<p><b>Consejo:</b> '+tip[1]+'</p>'
   +'<button class="btn sec sm" data-act="gopen" data-id="'+g.id+'">Gramática del día: '+g.t+'</button>'
   +'<button class="btn sm" data-act="daily">'+(done?'Repasar otra vez':'Repaso del día (+15 XP)')+'</button></div>';
  return h;
}
function dailyQueue(){
  var pool=learnedWords();if(pool.length<4)pool=WORDS.filter(function(w){return w.lid==="l1"||w.lid==="l2"});
  var ws=pool.slice().sort(function(a,b){return (S.words[a.eu]||0)-(S.words[b.eu]||0)||Math.random()-.5}).slice(0,6),q=[];
  ws.forEach(function(w,i){q.push(i%3===0?mkTy(w):mkCh(w,i%2?"eu2es":"es2eu"))});
  mcQueue(GR[dayNum()%GR.length]).slice(0,2).forEach(function(x){q.push(x)});
  return shuffle(q);
}

/* ---------- generadores de ejercicios ---------- */
function distract(w,key,n){
  var same=WORDS.filter(function(x){return x.lid===w.lid&&x[key]!==w[key]}),other=WORDS.filter(function(x){return x.lid!==w.lid&&x[key]!==w[key]});
  var arr=shuffle(same).concat(shuffle(other)),out=[],seen={};seen[w[key]]=1;
  for(var i=0;i<arr.length&&out.length<n;i++){var v=arr[i][key];if(!seen[v]){seen[v]=1;out.push(v)}}
  return out;
}
function mkCh(w,dir){var k=dir==="es2eu"?"eu":"es";return {t:"ch",dir:dir,w:w,ans:w[k],opts:shuffle([w[k]].concat(distract(w,k,3)))}}
function mkTy(w){return {t:"ty",w:w}}
function mkBd(p){return {t:"bd",eu:p.eu,es:p.es,ans:p.eu,tiles:shuffle(p.eu.split(" "))}}
function mkMt(ws){return {t:"mt",pairs:ws.map(function(w){return {eu:w.eu,es:w.es}})}}
function uniqEs(ws){var s={},o=[];ws.forEach(function(w){if(!s[w.es]){s[w.es]=1;o.push(w)}});return o}
function lessonQ1(l){
  var ws=shuffle(WORDS.filter(function(w){return w.lid===l.id})),q=[],ps=shuffle(PHR.filter(function(p){return p.lid===l.id}));
  ws.slice(0,6).forEach(function(w){q.push(mkCh(w,"eu2es"))});
  q.push(mkMt(uniqEs(ws).slice(0,4)));
  shuffle(ws).slice(0,5).forEach(function(w){q.push(mkCh(w,"es2eu"))});
  shuffle(ws).slice(0,2).forEach(function(w){q.push(mkTy(w))});
  ps.slice(0,3).forEach(function(p){q.push(mkBd(p))});
  return q;
}
/* ---------- ejercicios de nivel Normal y Difícil ---------- */
function pick(a,n){return shuffle(a).slice(0,n)}
function mkF(x,typed){return {t:"f",s:x.s,es:x.es,opts:shuffle(x.o),ans:x.a[0],a:x.a,w:x.w,typed:typed}}
function mkLis(w){return {t:"lis",w:w,ans:w.es,opts:shuffle([w.es].concat(distract(w,"es",3)))}}
function mkSay(p){return {t:"say",eu:p.eu,es:p.es}}
function mkTw(x){return {t:"tw",es:x.es,ok:x.ok}}
function mkDlg(x){return {t:"dlg",bot:x.bot,es:x.es,re:x.re,ok:x.ok,model:x.model}}
function mkCz(c){var bo={};for(var n in c.b)bo[n]=shuffle(c.b[n].o);return {t:"cz",eu:c.eu,b:c.b,bo:bo}}
function mkWr(x){return {t:"wr",p:x.p,check:x.check,model:x.model}}
function mkRd(l,n){if(!l.rd)return[];return pick(l.rd.q,n).map(function(x){return {t:"mc",q:x.q,opts:shuffle(x.o),ans:x.a,why:"",ctx:l.rd.eu,ctxEs:l.rd.es}})}
function lessonQueue(l){
  if(!l.lv||l.lv===1)return lessonQ1(l);
  var ws=shuffle(WORDS.filter(function(w){return w.lid===l.id})),ps=PHR.filter(function(p){return p.lid===l.id}),q=[];
  if(l.lv===2){
    ws.slice(0,3).forEach(function(w){q.push(mkCh(w,"eu2es"))});
    q.push(mkMt(uniqEs(ws).slice(0,4)));
    ws.slice(3,5).forEach(function(w){q.push(mkCh(w,"es2eu"))});
    ws.slice(5,7).forEach(function(w){q.push(mkLis(w))});
    q.push(mkTy(ws[7]||ws[0]));
    (l.f||[]).slice(0,2).forEach(function(x){q.push(mkF(x,false))});
    pick(ps,2).forEach(function(p){q.push(mkBd(p))});
    (l.tw||[]).slice(0,1).forEach(function(x){q.push(mkTw(x))});
    (l.d||[]).slice(0,1).forEach(function(x){q.push(mkDlg(x))});
    pick(ps,1).forEach(function(p){q.push(mkSay(p))});
    mkRd(l,2).forEach(function(x){q.push(x)});
  }else{
    ws.slice(0,2).forEach(function(w){q.push(mkCh(w,"eu2es"))});
    ws.slice(2,3).forEach(function(w){q.push(mkLis(w))});
    ws.slice(3,5).forEach(function(w){q.push(mkTy(w))});
    (l.f||[]).forEach(function(x){q.push(mkF(x,true))});
    (l.tw||[]).forEach(function(x){q.push(mkTw(x))});
    (l.d||[]).forEach(function(x){q.push(mkDlg(x))});
    if(l.cz)q.push(mkCz(l.cz));
    pick(ps,2).forEach(function(p){q.push(mkBd(p))});
    pick(ps,2).forEach(function(p){q.push(mkSay(p))});
    mkRd(l,2).forEach(function(x){q.push(x)});
    if(l.wr)q.push(mkWr(l.wr));
  }
  return q;
}

function reviewQueue(){
  var pool=learnedWords().sort(function(a,b){return (S.words[a.eu]||0)-(S.words[b.eu]||0)||Math.random()-.5}).slice(0,8),q=[];
  pool.forEach(function(w,i){q.push(i%3===0?mkTy(w):mkCh(w,i%3===1?"eu2es":"es2eu"))});
  var lp=PHR.filter(function(p){return S.done[p.lid]});
  shuffle(lp).slice(0,2).forEach(function(p){q.push(mkBd(p))});

/* ---------- exámenes ---------- */
function lvDone(n){return LESSONS.filter(function(l){return l.lv===n&&S.done[l.id]})}
function examQueue(n){
  var ls=lvDone(n),ids={};ls.forEach(function(l){ids[l.id]=1});
  var ws=shuffle(WORDS.filter(function(w){return ids[w.lid]})),ps=shuffle(PHR.filter(function(p){return ids[p.lid]})),q=[];
  ws.slice(0,5).forEach(function(w,i){q.push(mkCh(w,i%2?"eu2es":"es2eu"))});
  ws.slice(5,7).forEach(function(w){q.push(mkLis(w))});
  ws.slice(7,9).forEach(function(w){q.push(mkTy(w))});
  ps.slice(0,3).forEach(function(p){q.push(mkBd(p))});
  var fs=[],ts=[],ds=[];
  ls.forEach(function(l){(l.f||[]).forEach(function(x){fs.push(x)});(l.tw||[]).forEach(function(x){ts.push(x)});(l.d||[]).forEach(function(x){ds.push(x)})});
  pick(fs,3).forEach(function(x){q.push(mkF(x,n===3))});
  if(n>1){pick(ts,2).forEach(function(x){q.push(mkTw(x))});pick(ds,1).forEach(function(x){q.push(mkDlg(x))})}
  return shuffle(q);
}
function examCard(n){
  var d=lvDone(n).length,e=(S.exams||{})[n],need=3;
  if(d<need)return '<button class="rev" disabled>'+IC.check+'<div><b>Examen de nivel '+LVN[n]+'</b><span>Se abre al terminar '+need+' lecciones de este nivel ('+d+'/'+need+')</span></div></button>';
  var due=e?(d-(e.at||0)>=5):d>=5;
  return '<button class="rev'+(due?' due':'')+'" data-act="exam" data-n="'+n+'">'+IC.check+'<div><b>Examen de nivel '+LVN[n]+(due?' · ¡toca!':'')+'</b><span>'+(e?'Última nota '+e.last+' · mejor '+e.best+' / 10':'Comprueba cómo vas. Se aprueba con un 7')+'</span></div></button>';
}
function startExam(n){
  if(lvDone(n).length<3){toast("Termina antes 3 lecciones de este nivel");return}
  startRun({q:examQueue(n),exam:true,lv:n,title:"Examen"});
}
function finishExam(){

function uniqWords(arr){var s={};return arr.filter(function(w){if(s[w.eu])return false;s[w.eu]=1;return true})}
function gamePool(re,min){
  var arr=uniqWords(unlockedWords().filter(function(w){return re.test(w.eu)})),extra=false;
  if(arr.length<min){
    var seen={};arr.forEach(function(w){seen[w.eu]=1});
    var more=WORDS.filter(function(w){return re.test(w.eu)&&!seen[w.eu]});
    for(var i=0;i<more.length&&arr.length<min;i++){arr.push(more[i]);seen[more[i].eu]=1;extra=true}
  }
  return {arr:arr,extra:extra};

/* ---------- crucigrama ---------- */
function cwPut(g,word,r,c,d){
  for(var i=0;i<word.length;i++){
    var k=(r+(d==="d"?i:0))+","+(c+(d==="a"?i:0));
    if(!g[k])g[k]={ch:word[i],d:[]};
    g[k].d.push(d);
  }
}
function cwFits(g,word,r,c,d){
  var dr=d==="d"?1:0,dc=d==="a"?1:0,inter=0,L=word.length;
  if(g[(r-dr)+","+(c-dc)]||g[(r+dr*L)+","+(c+dc*L)])return false;
  for(var i=0;i<L;i++){
    var rr=r+dr*i,cc=c+dc*i,cell=g[rr+","+cc];
    if(cell){
      if(cell.ch!==word[i]||cell.d.indexOf(d)>=0)return false;
      inter++;
    }else if(g[(rr+dc)+","+(cc+dr)]||g[(rr-dc)+","+(cc-dr)])return false;
  }
  return inter>=1;
}
function cwBounds(g){
  var r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;
  for(var k in g){var p=k.split(","),r=+p[0],c=+p[1];if(r<r0)r0=r;if(r>r1)r1=r;if(c<c0)c0=c;if(c>c1)c1=c}
  return {r0:r0,c0:c0,h:r1-r0+1,w:c1-c0+1};
}
function genCross(pool,target){
  var best=null;
  for(var at=0;at<80;at++){
    var ws=shuffle(pool).slice(0,Math.min(pool.length,target+5)).sort(function(a,b){return b.eu.length-a.eu.length});
    var g={},placed=[];
    cwPut(g,ws[0].eu,0,0,"a");placed.push({w:ws[0],r:0,c:0,d:"a"});
    for(var k=1;k<ws.length&&placed.length<target;k++){
      var w=ws[k],cands=[];
      for(var i=0;i<w.eu.length;i++){
        for(var key in g){
          var cell=g[key];
          if(cell.ch!==w.eu[i]||cell.d.length!==1)continue;
          var p=key.split(","),r0=+p[0],c0=+p[1],d=cell.d[0]==="a"?"d":"a";
          var r=d==="d"?r0-i:r0,c=d==="a"?c0-i:c0;
          if(cwFits(g,w.eu,r,c,d))cands.push([r,c,d]);
        }
      }
      if(cands.length){var pk=cands[Math.floor(Math.random()*cands.length)];cwPut(g,w.eu,pk[0],pk[1],pk[2]);placed.push({w:w,r:pk[0],c:pk[1],d:pk[2]})}
    }
    var b=cwBounds(g);
    if(b.h>11||b.w>11)continue;
    var score=placed.length*100-b.h*b.w;
    if(!best||score>best.score)best={score:score,placed:placed,b:b};
  }
  return best;
}

  var b=res.b,words=res.placed.map(function(p){return {eu:p.w.eu,es:p.w.es,r:p.r-b.r0,c:p.c-b.c0,d:p.d,len:p.w.eu.length}});
  words.sort(function(x,y){return x.r-y.r||x.c-y.c||(x.d==="a"?-1:1)});
  var num={},n=0;
  words.forEach(function(w){var k=w.r+","+w.c;if(!num[k])num[k]=++n;w.num=num[k]});
  var g={};
  words.forEach(function(w){for(var i=0;i<w.len;i++){var r=w.r+(w.d==="d"?i:0),c=w.c+(w.d==="a"?i:0),k=r+","+c;g[k]={ch:w.eu[i],n:num[k]||0}}});

function cwWord(r,c,d){
  return CW.words.filter(function(w){return w.d===d&&(d==="a"?(w.r===r&&c>=w.c&&c<w.c+w.len):(w.c===c&&r>=w.r&&r<w.r+w.len))})[0]||null;
}
function cwCells(w){var o=[];for(var i=0;i<w.len;i++)o.push({r:w.r+(w.d==="d"?i:0),c:w.c+(w.d==="a"?i:0)});return o}
function cwCur(){

function cwSolved(w){return cwCells(w).every(function(p){var k=p.r+","+p.c;return CW.inp[k]===CW.g[k].ch})}
function cwComplete(){for(var k in CW.g)if(CW.inp[k]!==CW.g[k].ch)return false;return true}

  }

    return '<div class="kr">'+row.split("").map(function(k){return '<button class="k" data-r="cwk" data-k="'+k+'">'+k+'</button>'}).join("")+(i===2?'<button class="k w" data-r="cwk" data-k="back" aria-label="Borrar">⌫</button>':"")+'</div>';
  }).join("")+'</div><div class="row2"><button class="btn sec sm" data-r="cwchk">Comprobar</button><button class="btn sec sm" data-r="cwhint">Pista</button></div>';

function cwSelect(r,c){
  if(!CW.g[r+","+c])return;

  else{CW.sel={r:r,c:c};if(!cwWord(r,c,CW.dir))CW.dir=CW.dir==="a"?"d":"a"}
  drawCW();

function cwKey(k){
  if(!CW||CW.done||!CW.sel)return;
  var cur=cwCur();if(!cur)return;
  var cells=cwCells(cur),idx=-1,key=CW.sel.r+","+CW.sel.c;
  cells.forEach(function(p,i){if(p.r===CW.sel.r&&p.c===CW.sel.c)idx=i});
  if(k==="back"){
    if(CW.inp[key])delete CW.inp[key];
    else if(idx>0){CW.sel={r:cells[idx-1].r,c:cells[idx-1].c};delete CW.inp[CW.sel.r+","+CW.sel.c]}
  }else if(/^[a-z]$/.test(k)){
    CW.inp[key]=k;
    if(idx<cells.length-1)CW.sel={r:cells[idx+1].r,c:cells[idx+1].c};
  }

function cwWin(){

/* ---------- sopa de letras ---------- */
function genWS(words){
  var N=10,dirs=[[0,1],[1,0],[1,1],[-1,1]];
  for(var attempt=0;attempt<40;attempt++){
    var grid=[],i,j;
    for(i=0;i<N;i++){grid.push([]);for(j=0;j<N;j++)grid[i].push("")}
    var placed=[];
    words.forEach(function(w){
      for(var t=0;t<150;t++){
        var d=dirs[Math.floor(Math.random()*dirs.length)],s=Math.random()<.2?w.eu.split("").reverse().join(""):w.eu,L=s.length;
        var r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N),er=r+d[0]*(L-1),ec=c+d[1]*(L-1);
        if(er<0||er>=N||ec<0||ec>=N)continue;
        var ok=true,cells=[];
        for(var k=0;k<L;k++){var rr=r+d[0]*k,cc=c+d[1]*k,ch=grid[rr][cc];if(ch&&ch!==s[k]){ok=false;break}cells.push([rr,cc])}
        if(!ok)continue;
        cells.forEach(function(p,n){grid[p[0]][p[1]]=s[n]});
        placed.push({eu:w.eu,es:w.es,found:false});return;
      }
    });
    if(placed.length>=Math.min(5,words.length)){
      var fill="aaaaeeeeiioouukkrrtnzbdgslmhpx";
      for(i=0;i<N;i++)for(j=0;j<N;j++)if(!grid[i][j])grid[i][j]=fill[Math.floor(Math.random()*fill.length)];
      return {N:N,grid:grid,words:placed};
    }
  }
  return null;
}
function startWS(){
  LAST="ws";

  if(!res){toast("No se pudo crear la sopa de letras. Inténtalo otra vez.");return}
  WS={N:res.N,grid:res.grid,words:res.words,fd:{},start:null,end:null,tap:false,drag:false,miss:0,over:false,extra:pp.extra};
  showStage();drawWS();
}
function drawWS(){

function wsPath(a,b){
  var dr=b.r-a.r,dc=b.c-a.c,n=Math.max(Math.abs(dr),Math.abs(dc));
  if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return null;
  var sr=dr?dr/Math.abs(dr):0,sc=dc?dc/Math.abs(dc):0,out=[];
  for(var i=0;i<=n;i++)out.push({r:a.r+sr*i,c:a.c+sc*i});
  return out;
}

  if(WS.start){var p=WS.end?wsPath(WS.start,WS.end):null;if(p)p.forEach(function(q){sel[q.r+","+q.c]=1});else sel[WS.start.r+","+WS.start.c]=1}

function wsEval(){

    if(WS.words.every(function(w){return w.found})){WS.over=true;var xp=Math.max(15,35-WS.miss*2);return endGame("¡Sopa completada!",xp,WS.miss?("Intentos fallidos: "+WS.miss):"Sin fallos")}

}

  if(k==="cwc"){cwSelect(+r.getAttribute("data-rr"),+r.getAttribute("data-cc"));return}
  if(k==="cwk"){cwKey(r.getAttribute("data-k"));return}
  if(k==="cwcl"){var w=CW.words[+r.getAttribute("data-i")];CW.sel={r:w.r,c:w.c};CW.dir=w.d;drawCW();return}
  if(k==="cwchk"){CW.chk=true;drawCW();return}
  if(k==="cwhint"){
    var kk=CW.sel?CW.sel.r+","+CW.sel.c:null;
    if(!kk||!CW.g[kk]||CW.inp[kk]===CW.g[kk].ch){kk=null;for(var key in CW.g){if(CW.inp[key]!==CW.g[key].ch){kk=key;break}}}
    if(!kk)return;
    var pr=kk.split(",");CW.sel={r:+pr[0],c:+pr[1]};
    CW.inp[kk]=CW.g[kk].ch;CW.hints++;CW.chk=false;toast("Pista: letra «"+CW.g[kk].ch+"»");if(cwComplete())return cwWin();drawCW();return}
  if(k==="so"){storyPick(+r.getAttribute("data-i"));return}
  if(k==="tr"){var n=+r.getAttribute("data-i");ST.tr[n]=!ST.tr[n];drawStory();return}
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="vq"){V.vq=ev.target.value;var l=$("#vlist");if(l)l.innerHTML=vlist()}
});
document.addEventListener("keydown",function(ev){
  var el=ev.target;
  if(el&&el.id==="ty"&&ev.key==="Enter"){ev.preventDefault();check();return}
  if(CW&&!CW.done&&!$("#stage").hidden&&el.tagName!=="INPUT"&&!ev.ctrlKey&&!ev.metaKey){
    if(ev.key==="Backspace")cwKey("back");else if(/^[a-zA-Z]$/.test(ev.key))cwKey(ev.key.toLowerCase());
  }
});
document.addEventListener("pointerdown",function(ev){
  if(!WS||WS.over)return;
  var el=ev.target.closest?ev.target.closest(".wsc"):null;if(!el)return;
  var cell=wsCell(el);
  if(WS.tap&&WS.start){WS.end=cell;WS.tap=false;wsEval();return}
  WS.start=cell;WS.end=cell;WS.drag=true;wsPaint();
});
document.addEventListener("pointermove",function(ev){
  if(!WS||!WS.drag)return;
  var e=document.elementFromPoint(ev.clientX,ev.clientY),el=e&&e.closest?e.closest(".wsc"):null;
  if(el){WS.end=wsCell(el);wsPaint()}
});
document.addEventListener("pointerup",wsUp);
document.addEventListener("pointercancel",wsUp);
document.addEventListener("change",function(ev){
  var cs=ev.target.closest?ev.target.closest('[data-r="czs"]'):null;
  if(cs&&R&&R.st&&R.st.cz){R.st.cz[cs.getAttribute("data-n")]=cs.value;drawEx();return}
  if(ev.target.id==="vsel"){
    var v=VZ.list.find(function(x){return x.voiceURI===ev.target.value});
    if(v){VZ.voice=v;try{localStorage.setItem("hitzezVoice",v.voiceURI)}catch(e){}say("Kaixo!")}
  }
});

/* ---------- botón atrás del móvil: lleva al inicio y pregunta antes de salir ---------- */
(function(){
  if(window.top!==window||!window.history||!history.pushState)return;
  var armed=false,asking=false;
  function arm(){
    if(armed)return;armed=true;
    try{history.replaceState({txapi:"base"},"");history.pushState({txapi:"app"},"")}catch(e){armed=false}
  }
  document.addEventListener("pointerdown",arm,{once:true,capture:true});
  function closeAsk(){var m=document.getElementById("exitq");if(m)m.remove();asking=false}
  function askExit(){
    if(asking)return;asking=true;
    var m=document.createElement("div");m.className="modal";m.id="exitq";
    m.innerHTML='<div role="dialog" aria-label="Salir de Txapi">'+mascot(110,"base")+'<h3 style="font-size:22px">¿Salir de Txapi?</h3><p class="hint">Tu progreso está guardado.</p><button class="btn" id="exstay">Seguir aprendiendo</button><button class="btn sec" id="exgo">Salir</button></div>';
    document.body.appendChild(m);
    document.getElementById("exstay").onclick=closeAsk;
    document.getElementById("exgo").onclick=function(){closeAsk();armed=false;history.go(-2);setTimeout(function(){try{window.close()}catch(e){}},400)};
  }
  window.addEventListener("popstate",function(){
    if(!armed)return;
    try{history.pushState({txapi:"app"},"")}catch(e){}
    if(asking){closeAsk();return}
    if(!$("#stage").hidden){
      if(R&&R.quitAsk){R.quitAsk=false;drawEx();return}
      if(R&&R.finished){leave();return}
      if(R&&R.cur&&!R.intro){R.quitAsk=true;drawEx();return}
      leave();return;
    }
    if(V.tab!=="learn"){V.tab="learn";V.reset=false;render();window.scrollTo(0,0);return}
    askExit();
  });
})();
render();
</script>
